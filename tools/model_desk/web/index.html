<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Desk · 模型工作台</title><link rel="stylesheet" href="/style.css"><body><aside><div class="brand"><b>⌁</b> Model Desk</div><small>工作空间</small><nav><button data-page="home">▤　模型设置</button><button data-page="apps">▦　应用设置</button><button data-page="try">▷　简单调用</button></nav><div class="local"><i></i> 本机工作空间</div></aside><main><header><span>工作空间　/　<strong id="crumb">工作台</strong></span><button id="add">＋ 接入模型</button></header><article id="content"></article></main><dialog id="dialog" aria-labelledby="formtitle"><form id="config"><div class="line"><h2 id="formtitle">接入模型</h2><button type="button" id="close" aria-label="关闭">×</button></div><div class="settings-body"><div class="connection-settings"><h3>模型接入</h3><div class="config-grid"><label>接入供谁使用<select name="scope"><option value="common">各项目可用</option><option value="special">指定项目 / 场景</option></select></label><label>部署位置<select name="deployment"><option value="local">本机</option><option value="remote">远程服务器</option></select></label></div>
<label id="project-field" hidden>专用项目或场景<input name="project" list="projects" placeholder="选择或输入名称"><datalist id="projects"></datalist></label>
<label>接口地址<input required name="endpoint" value="http://127.0.0.1:11434/v1"></label><button type="button" id="discover">从接口发现模型</button><label>显示名称<input name="alias" placeholder="可选"></label><label>模型 ID<input list="discovered" name="model" required placeholder="输入或选择服务提供的模型 ID"><datalist id="discovered"></datalist></label><label>调用类型<select name="kind"><option value="chat">聊天</option><option value="asr">语音转写</option><option value="tts">语音合成</option><option value="image">图片生成</option></select></label><label id="input-capability">聊天输入能力<select name="chatInput"><option value="vision">多模态（文字和图片）</option><option value="text">仅文字</option><option value="unknown">待确认</option></select></label></div><fieldset id="generation"><legend>聊天参数</legend><p class="muted">从 Model Desk 的下一条消息起生效。</p>
<label>参数作用范围<select name="paramLayer"><option value="base">模型基础设置（各项目共用）</option><option value="override">当前接入的特殊设置</option></select></label><p class="muted" id="layer-help"></p><div class="config-grid"><label>保留历史（轮）<input type="number" min="0" step="1" name="historyTurns" placeholder="全部"></label><label>最大输出（token）<input type="number" min="1" step="1" name="max_tokens" placeholder="服务默认"></label></div>
<label id="input-limit">最大输入（token）<input type="number" min="1" step="1" name="inputLimit" placeholder="由服务限制"></label>
<label id="think-level">思考程度<select name="thinking"><option value="">服务默认</option><option value="off">直接回答</option><option value="256">简短思考 · 256 token</option><option value="1024">适中思考 · 1024 token</option><option value="4096">深入思考 · 4096 token</option></select></label>
<details><summary>高级设置</summary><div class="config-grid"><label>随机性（温度）<input name="temperature" type="number" min="0" max="2" step="any" placeholder="服务默认"></label><label>采样范围（Top P）<input name="top_p" type="number" min="0" max="1" step="any" placeholder="服务默认"></label></div><label>系统提示词<textarea name="systemPrompt" placeholder="例如：用中文简洁回答"></textarea></label></details>
</fieldset></div><footer class="settings-actions"><p id="formmsg" role="status"></p><button class="primary">保存模型</button></footer></form></dialog><script src="/vendor/idb-8.0.3/idb.js"></script><script src="/app.js"></script></body></html>
