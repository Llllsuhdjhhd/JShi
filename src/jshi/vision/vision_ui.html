<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>匠石 · 环境观察</title><style>
body{font:16px/1.65 system-ui;margin:0;background:#f5f7fb;color:#263247}main{max-width:900px;margin:40px auto;padding:24px}button,a,input{font:inherit}button{padding:8px 16px;margin:6px;border:0;border-radius:8px;background:#285ddb;color:white}section{background:white;padding:24px;border-radius:16px;margin:20px 0}video,img{max-width:100%;max-height:360px;border-radius:10px}pre{white-space:pre-wrap;font:inherit}small{color:#637086}.photos{display:flex;gap:12px;flex-wrap:wrap}.photos article{width:240px}.photos img{width:240px}input[type=text]{width:90%;padding:8px}button:disabled{opacity:.5}
</style><main><a href="/">返回交谈</a><h1>环境观察</h1>
<section><p id="capture-hint">连接设备后可查看当前画面。</p>
<button id="start" disabled>开始观察</button><button id="stop" disabled>停止观察</button>
<label>或选择照片 <input id="file" type="file" accept="image/*" disabled></label></section>
<p id="status" role="status"></p>
<section><h2>当前环境</h2><small id="time"></small><pre id="description">暂无环境描述</pre><img id="scene" alt="当前环境画面" hidden></section>
<section id="face-section" hidden><h2>人物关联</h2><p><small>面孔参考自动积累。认错或尚未关联时，可以在这里选择人物。</small></p><div id="faces"></div></section>
<section><h2>经历中的照片</h2><p><small>已关联经历的照片可以取回并按需重新查看。</small></p><div id="memories" class="photos"></div></section>
<script>
const $=id=>document.getElementById(id);
function say(s){$('status').textContent=s}
const controls=typeof BroadcastChannel==='function'?new BroadcastChannel('jshi-desktop-vision'):null;
let desktopCapture='';
function control(action,file){
 if(!desktopCapture||!controls)return;
 controls.postMessage({capture:desktopCapture,action,file});
 say('已向本浏览器中连接的交谈页面发送操作');
}
$('start').onclick=()=>control('start');
$('stop').onclick=()=>control('stop');
$('file').onchange=()=>{const file=$('file').files[0];if(file)control('photo',file);$('file').value=''};
function captureState(capture){
 desktopCapture=capture?.id||'';
 $('start').disabled=$('stop').disabled=$('file').disabled=!desktopCapture||!controls;
 $('capture-hint').textContent=!capture?'连接设备后可查看当前画面。':desktopCapture&&controls?
   '这些操作使用同一浏览器中已连接的交谈页面采集画面。':'请在当前采集设备上操作摄像头。';
}
window.addEventListener('pagehide',()=>controls?.close(),{once:true});
let faceSignature='';
function showFaces(data){
 const s=data.environment;
 const faces=(s?.analysis||[]).filter(r=>r.module==='face'&&r.status==='completed').flatMap(r=>r.result?.faces||[]);
 $('face-section').hidden=!data.face_enabled||!data.portrait_enabled||!faces.length;
 const signature=JSON.stringify([s?.frame,faces,data.people]);if(signature===faceSignature)return;faceSignature=signature;
 $('faces').replaceChildren();
 for(const face of faces){
  if(!face.face)continue;
  const row=document.createElement('p'),label=document.createElement('span'),select=document.createElement('select'),button=document.createElement('button');
  label.textContent=face.face+' · '+(face.object_id?'已有身份候选':'尚未关联')+' ';
  const empty=document.createElement('option');empty.value='';empty.textContent='选择人物';select.append(empty);
  for(const p of data.people||[]){const option=document.createElement('option');option.value=p.object_id;option.textContent=p.label;select.append(option)}
  select.value=face.object_id||'';button.textContent='关联 / 纠正';
  button.onclick=async()=>{if(!select.value)return;button.disabled=true;try{const r=await fetch('/api/vision/associate-face',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame:s.frame,face:face.face,object_id:select.value})});say(r.ok?'人物关联已更新':await r.text())}catch(e){say('人物关联暂未完成')}finally{button.disabled=false}};
  if(face.box&&s.image_available){const canvas=document.createElement('canvas'),image=new Image();canvas.width=128;canvas.height=128;canvas.setAttribute('aria-label',face.face+'的面孔区域');image.onload=()=>{const [x1,y1,x2,y2]=face.box;canvas.getContext('2d').drawImage(image,x1*image.width,y1*image.height,(x2-x1)*image.width,(y2-y1)*image.height,0,0,128,128)};image.src='/api/vision/photo/'+s.frame;row.append(canvas)}
  row.append(label,select,button);$('faces').append(row);
 }
}
let memorySignature='',errorSignature='';async function refresh(){try{const data=await (await fetch('/api/vision')).json();captureState(data.capture);const error=data.errors?.[0];if(error&&String(error.at)!==errorSignature){errorSignature=String(error.at);say(error.message)}const s=data.environment;showFaces(data);if(s){$('description').textContent=s.description+(s.detections.length?'\n\n本地检测：'+JSON.stringify(s.detections):'');$('time').textContent='画面：'+new Date(s.captured*1000).toLocaleString()+'；描述依据：'+(s.described_at?new Date(s.described_at*1000).toLocaleString():'尚未完成');$('scene').hidden=!s.image_available;if(s.image_available)$('scene').src='/api/vision/photo/'+s.frame}else{$('description').textContent='暂无当前画面';$('time').textContent='';$('scene').hidden=true;$('scene').removeAttribute('src')}const rows=(await (await fetch('/api/vision/memories')).json()).observations;const sig=JSON.stringify(rows.map(s=>[s.id,s.image_available]));if(sig===memorySignature)return;memorySignature=sig;$('memories').replaceChildren();for(const s of rows){const a=document.createElement('article'),img=document.createElement('img'),p=document.createElement('p'),input=document.createElement('input'),button=document.createElement('button');img.hidden=!s.image_available;if(s.image_available)img.hidden=!s.image_available;if(s.image_available)img.src='/api/vision/photo/'+s.frame;img.alt='经历关联照片';p.textContent=s.description.slice(0,150);input.type='text';input.placeholder='想再看什么？';input.setAttribute('aria-label','重新查看照片的问题');input.setAttribute('aria-label','重新查看照片的问题');button.textContent=s.image_available?'重新查看':'照片已清理';button.disabled=!s.image_available;button.onclick=async()=>{button.disabled=true;try{const r=await fetch('/api/vision/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame:s.frame,question:input.value||'描述照片中的人、空间与物体'})});say(r.ok?'已安排重新观察，结果交给匠石':await r.text())}catch(e){say('重新观察暂时无法安排')}finally{button.disabled=!s.image_available}};a.append(img,p,input,button);$('memories').append(a)}}catch(e){say('环境信息暂时无法读取')}}
refresh();setInterval(refresh,3000);
</script></main></html>
