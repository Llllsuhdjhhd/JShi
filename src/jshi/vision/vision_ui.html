<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>匠石 · 环境观察</title><style>
body{font:16px/1.65 system-ui;margin:0;background:#f5f7fb;color:#263247}main{max-width:900px;margin:40px auto;padding:24px}button,a,input{font:inherit}button{padding:8px 16px;margin:6px;border:0;border-radius:8px;background:#285ddb;color:white}section{background:white;padding:24px;border-radius:16px;margin:20px 0}video,img{max-width:100%;max-height:360px;border-radius:10px}pre{white-space:pre-wrap;font:inherit}small{color:#637086}.photos{display:flex;gap:12px;flex-wrap:wrap}.photos article{width:240px}.photos img{width:240px}input[type=text]{width:90%;padding:8px}button:disabled{opacity:.5}
</style><main><a href="/">返回交谈</a><h1>环境观察</h1>
<section><p>画面独立采样，匠石按需要使用最新环境信息。</p><button id="start">开始观察</button><button id="stop" disabled>停止观察</button>
<label>或选择照片 <input id="file" type="file" accept="image/*"></label><p id="status" role="status">尚未开始</p><video id="video" muted playsinline hidden></video></section>
<section><h2>当前环境</h2><small id="time"></small><pre id="description">暂无环境描述</pre><img id="scene" alt="当前环境画面" hidden></section>
<section><h2>经历中的照片</h2><p><small>已关联经历的照片可以取回并按需重新查看。</small></p><div id="memories" class="photos"></div></section>
<script>
const $=id=>document.getElementById(id);let stream=null,timer=null,interval=2000,sending=false,clockOffset=0,clockUncertainty=0;
function say(s){$('status').textContent=s}
async function send(blob,captured=Date.now()/1000){if(sending)return;sending=true;try{const r=await fetch('/api/vision/frame',{method:'POST',headers:{'Content-Type':blob.type,'X-Captured-At':String(captured),'X-Clock-Offset':String(clockOffset),'X-Clock-Uncertainty':String(clockUncertainty),'X-Visual-Source':'browser'},body:blob});if(!r.ok)throw Error(await r.text());say('画面已接收，正在后台观察')}catch(e){say(e.message)}finally{sending=false}}
async function tick(){if(!stream||!$('video').videoWidth)return;const captured=Date.now()/1000,c=document.createElement('canvas');c.width=Math.min(1280,$('video').videoWidth);c.height=c.width*$('video').videoHeight/$('video').videoWidth;c.getContext('2d').drawImage($('video'),0,0,c.width,c.height);c.toBlob(b=>b&&send(b,captured),'image/jpeg',.85)}
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();$('start').disabled=true;$('stop').disabled=false;timer=setInterval(tick,interval);tick()}catch(e){say(e.message)}};
function stop(){clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').hidden=true;$('start').disabled=false;$('stop').disabled=true;say('已停止画面采样')}
$('stop').onclick=stop;window.addEventListener('pagehide',stop);$('file').onchange=()=>{const f=$('file').files[0];if(f)send(f)};
let memorySignature='',errorSignature='';async function refresh(){try{const data=await (await fetch('/api/vision')).json();interval=data.sample_seconds*1000;const error=data.errors?.[0];if(error&&String(error.at)!==errorSignature){errorSignature=String(error.at);say(error.message)}const s=data.environment;if(s){$('description').textContent=s.description+(s.detections.length?'\n\n本地检测：'+JSON.stringify(s.detections):'');$('time').textContent='画面：'+new Date(s.captured*1000).toLocaleString()+'；描述依据：'+new Date(s.described_at*1000).toLocaleString();$('scene').hidden=!s.image_available;if(s.image_available)$('scene').src='/api/vision/photo/'+s.frame}const rows=(await (await fetch('/api/vision/memories')).json()).observations;const sig=JSON.stringify(rows.map(s=>[s.id,s.image_available]));if(sig===memorySignature)return;memorySignature=sig;$('memories').replaceChildren();for(const s of rows){const a=document.createElement('article'),img=document.createElement('img'),p=document.createElement('p'),input=document.createElement('input'),button=document.createElement('button');img.hidden=!s.image_available;if(s.image_available)img.hidden=!s.image_available;if(s.image_available)img.src='/api/vision/photo/'+s.frame;img.alt='经历关联照片';p.textContent=s.description.slice(0,150);input.type='text';input.placeholder='想再看什么？';input.setAttribute('aria-label','重新查看照片的问题');input.setAttribute('aria-label','重新查看照片的问题');button.textContent=s.image_available?'重新查看':'照片已清理';button.disabled=!s.image_available;button.onclick=async()=>{button.disabled=true;try{const r=await fetch('/api/vision/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame:s.frame,question:input.value||'描述照片中的人、空间与物体'})});say(r.ok?'已安排重新观察，结果交给匠石':await r.text())}catch(e){say('重新观察暂时无法安排')}finally{button.disabled=!s.image_available}};a.append(img,p,input,button);$('memories').append(a)}}catch(e){say('环境信息暂时无法读取')}}
async function syncClock(){try{const start=Date.now()/1000,data=await(await fetch('/api/vision')).json(),end=Date.now()/1000;clockOffset=data.server_time-(start+end)/2;clockUncertainty=(end-start)/2}catch(e){say('时钟校准暂未完成')}}
syncClock().then(refresh);setInterval(refresh,3000);setInterval(syncClock,60000);
</script></main></html>
