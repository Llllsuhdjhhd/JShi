<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景测试库</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{font:15px/1.7 system-ui;max-width:1050px;margin:36px auto;padding:20px;background:#f3f6f1;color:#263f36}h1{font-size:32px;margin-bottom:0}h2{font-size:19px}input,textarea,button{font:inherit;margin:6px 0;padding:10px}button{border:1px solid #ccdace;border-radius:9px;background:white;color:#285d46;cursor:pointer;margin-right:8px}button:hover{background:#e9f0e7}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #96bfa4}#save{background:#285d46;color:white;border:0}input:not([type=file]):not([type=range]),textarea{border:1px solid #d7e2d5;border-radius:8px;background:#fbfdf9}textarea{width:100%;min-height:90px}article{border:1px solid #d7e2d5;border-radius:17px;background:white;padding:24px;margin:22px 0}label{display:block;color:#617665}p{color:#617665}a{color:#285d46}audio{display:block;width:100%;margin:14px 0}#cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}#cases article{margin:0}#message{position:sticky;bottom:15px;padding:12px;border-radius:10px;background:#e2eddf}#message:empty{display:none}.recording{border-top:1px solid #e3eae0;padding:12px 0}.ranges{display:flex;gap:24px}.ranges label{flex:1}.ranges input{width:100%}canvas{width:100%;height:90px;background:#f1f6ed;border-radius:10px}#trim{display:none}#name{width:100%}.hint{font-size:13px;color:#718172}pre{white-space:pre-wrap}@media(max-width:600px){body{margin:12px auto;padding:14px}article{padding:18px}.ranges{display:block}}</style>
<h1>把这段现场，留下来。</h1><p>场景录音库 · 原声长期保存，测试可以反复进行。</p><a href="/recent-audio">← 近期录音</a>
<p>连续录音独立长期保存。当前页面提供添加、试听和场景编辑；回放通过命令行运行。</p>
<article><h2>01　选择录音</h2><div id="recordings">正在读取近期录音…</div><button id="refreshRecent">刷新近期录音</button><details><summary>上传已有录音</summary><input id="file" type="file" accept="audio/wav"><button id="upload">保存录音素材</button>
<p>支持16kHz、单声道、16位PCM WAV。</p>
</details><p id="media" class="hint">从近期录音中选一段，或上传已有文件。</p><canvas id="wave" width="800" height="90" aria-label="录音波形"></canvas><audio id="player" controls></audio><div id="trim"><h2>02　试听与截取</h2><div class="ranges"><label>开始 <span id="startLabel"></span><input id="start" type="range" min="0" step="0.1"><button id="markStart">当前播放位置作起点</button></label><label>结束 <span id="endLabel"></span><input id="end" type="range" min="0" step="0.1"><button id="markEnd">当前播放位置作终点</button></label></div><p id="duration"></p><button id="audition">试听选中区间</button><button id="retain">保存这段原声</button><p class="hint">保留自然停顿与背景音，后续测试会重新断句。单次最多保存五分钟。</p></div></article>
<article><h2>03　保存场景</h2><label for="name">名称（必填）</label><input id="name" placeholder="例如：客厅里的一次交谈"><label for="description">现场说明（可稍后补充）</label><textarea id="description" placeholder="有哪些人、当时发生什么？"></textarea>
<input id="mediaId" type="hidden"><label>在场景开始后第几秒输入 <input id="at" type="number" min="0" step="0.1" value="0"></label>
<textarea id="expected" placeholder="人工预期（只供评估，不发送模型）"></textarea>
<button id="save">保存场景与录音</button><button id="new">新建场景</button><p class="hint">录音独立留存，不随近期缓存清理；预期与人物标注可以之后补充。</p></article><h2>已收录的场景</h2><input id="search" placeholder="搜索场景" aria-label="搜索场景"><p id="message" role="status" aria-live="polite"></p><div id="cases"></div>
<script>
const $=id=>document.getElementById(id);
async function api(path,options){const r=await fetch('/api/entry-tests/'+path,options);const v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v;}
let busy=false,part=null,peaks=[],stopAt=null;
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('message').textContent='已完成，录音与场景可以随时继续补充。';}catch(e){$('message').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function selected(v){part=null;$('trim').style.display='none';$('mediaId').value=v.media;$('media').textContent='原声已独立保存，可填写名称建立场景。';preview('/api/entry-tests/media/'+encodeURIComponent(v.media)+'.wav');}
function fmt(s){return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');}
function ranges(){$('startLabel').textContent=fmt(Number($('start').value));$('endLabel').textContent=fmt(Number($('end').value));$('duration').textContent='选中 '+Math.max(0,Number($('end').value)-Number($('start').value)).toFixed(1)+' 秒';draw();}
function draw(){const c=$('wave'),ctx=c.getContext('2d');ctx.clearRect(0,0,800,90);const total=Number($('end').max)||1;if(part){ctx.fillStyle='#d7e8d0';ctx.fillRect(Number($('start').value)/total*800,0,(Number($('end').value)-Number($('start').value))/total*800,90);}ctx.fillStyle='#44755a';peaks.forEach((v,i)=>ctx.fillRect(i*2,45-v*40,1.5,Math.max(1,v*80)));}
let previewVersion=0;
async function preview(url){const version=++previewVersion;$('player').src=url;peaks=[];draw();try{const response=await fetch(url);if(!response.ok)throw Error('读取录音失败');const context=new AudioContext();try{const buffer=await context.decodeAudioData(await response.arrayBuffer());if(version!==previewVersion)return;const data=buffer.getChannelData(0);for(let i=0;i<400;i++){let peak=0;for(let j=Math.floor(i*data.length/400);j<Math.floor((i+1)*data.length/400);j++)peak=Math.max(peak,Math.abs(data[j]));peaks.push(peak);}draw();}finally{await context.close();}}catch(e){$('message').textContent='波形暂不可用，可使用播放器试听。';}}
async function recent(){const r=await fetch('/api/recent-audio');if(!r.ok)throw Error('读取近期录音失败');const v=await r.json();$('recordings').replaceChildren();if(!v.recordings?.length)$('recordings').textContent='暂无近期录音，可以上传已有文件。';for(const p of v.recordings||[]){const row=document.createElement('div');row.className='recording';const title=document.createElement('span');title.textContent=new Date(p.updated*1000).toLocaleString('zh-CN')+' · '+fmt(p.size/32000)+'　';const b=document.createElement('button');b.textContent='选取这段现场';b.onclick=()=>action(async()=>{part=p;editing=null;$('mediaId').value='';$('trim').style.display='block';$('start').max=$('end').max=p.size/32000;$('start').value=0;$('end').value=p.size/32000;$('media').textContent='先试听，可拖动起止位置或使用当前播放位置。';await preview('/api/recent-audio-stream/'+encodeURIComponent(p.capture)+'/'+p.start+'.wav');ranges();});row.append(title,b);$('recordings').append(row);}}
$('refreshRecent').onclick=()=>action(recent);$('start').oninput=$('end').oninput=ranges;
$('markStart').onclick=()=>{$('start').value=$('player').currentTime;ranges();};$('markEnd').onclick=()=>{$('end').value=$('player').currentTime;ranges();};$('audition').onclick=()=>{const a=Number($('start').value),b=Number($('end').value);if(b<=a){$('message').textContent='请让结束位置晚于开始位置';return;}$('player').currentTime=a;stopAt=b;$('player').play().catch(e=>$('message').textContent=e.message);};$('player').ontimeupdate=()=>{if(stopAt!==null&&$('player').currentTime>=stopAt){$('player').pause();stopAt=null;}};
$('upload').onclick=()=>action(async()=>{const f=$('file').files[0];if(!f)throw Error('请选择录音');selected(await api('media',{method:'POST',body:f}));});
async function retain(){if(!part)throw Error('请先选择近期录音');const offset=part.start/32;selected(await api('retain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capture:part.capture,start_ms:Math.round(offset+Number($('start').value)*1000),end_ms:Math.round(offset+Number($('end').value)*1000)})}));}
$('retain').onclick=()=>action(retain);
let editing=null;
$('save').onclick=()=>action(async()=>{if(!$('name').value.trim())throw Error('请填写场景名称');if(part)await retain();if(!$('mediaId').value)throw Error('请选择或上传录音');const audio={type:'audio',media:$('mediaId').value,at_ms:Number($('at').value)*1000};const timeline=editing?editing.timeline.map((e,i)=>i===editing.timeline.findIndex(x=>x.type==='audio')?audio:e):[audio];const value={...(editing||{}),schema_version:1,name:$('name').value,description:$('description').value,annotations:{...editing?.annotations,note:$('expected').value},timeline};const saved=await api('cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});editing=saved;$('save').textContent='保存场景修改';await refresh();});
$('new').onclick=()=>{editing=null;part=null;$('mediaId').value=$('name').value=$('description').value=$('expected').value='';$('at').value=0;$('player').pause();$('trim').style.display='none';$('save').textContent='保存场景与录音';$('name').focus();};
let cases=[];async function refresh(){cases=await api('cases');render();}function render(){$('cases').replaceChildren();const matches=cases.filter(c=>(c.name+' '+(c.description||'')).includes($('search').value));if(!matches.length)$('cases').textContent=cases.length?'没有匹配的场景。':'还没有场景。从上方选择一段录音开始。';for(const c of matches){const box=document.createElement('article'),title=document.createElement('h3'),desc=document.createElement('p'),edit=document.createElement('button');title.textContent=c.name;desc.textContent=c.description||'现场说明待补充';box.append(title,desc);const stamp=document.createElement('p');stamp.className='hint';const date=new Date(c.saved_at);stamp.textContent=c.saved_at&&!Number.isNaN(date.getTime())?'保存时间：'+date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间'+(c.saved_at_basis==='file_time'?'，依据历史文件时间':'')+'）':'保存时间：未记录';box.append(stamp);const e=c.timeline.find(x=>x.type==='audio');if(e){const player=document.createElement('audio');player.controls=true;player.preload='none';player.src='/api/entry-tests/media/'+encodeURIComponent(e.media)+'.wav';box.append(player);}edit.textContent='补充说明／编辑';edit.onclick=()=>{if(!e){$('message').textContent='此场景需要高级配置编辑';return;}editing=c;$('name').value=c.name;$('description').value=c.description||'';$('expected').value=c.annotations?.note||'';selected({media:e.media});$('at').value=e.at_ms/1000;$('save').textContent='保存场景修改';window.scrollTo({top:0,behavior:'smooth'});};box.append(edit);$('cases').append(box);}}
$('search').oninput=render;Promise.all([refresh(),recent()]).catch(e=>$('message').textContent=e.message);
</script></html>
