<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101310"><title>匠石 · 手机采集</title>
<style>
:root{color-scheme:dark;font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;color:#f6f7f2;background:#101310}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate}
button,select,input{font:inherit}button,summary,select{cursor:pointer}button{color:inherit;border:1px solid #ffffff40;border-radius:24px;background:#222823ed;min-height:44px;padding:8px 16px}
button:disabled{opacity:.42}button:focus-visible,summary:focus-visible{outline:3px solid #b4ee95}button[aria-pressed=true],.primary{background:#c9f0ac;color:#162312;border-color:transparent}
#stage,#camEmpty{position:absolute;inset:0;display:grid;place-items:center;background:#101310}
#camEmpty{color:#a4aea5;font-size:15px}
#sensor,#preview{grid-area:1/1}#sensor{width:100%;height:100%;object-fit:contain;pointer-events:none;visibility:visible}
#preview{z-index:1;width:min(100vw,calc(100vh * var(--ratio,1)));width:min(100vw,calc(100dvh * var(--ratio,1)));height:auto;max-height:100%;background:#101310;touch-action:none}
header,footer,#gate,#settings,#notice{position:absolute;z-index:2}
header{top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
header button{pointer-events:auto}#state{padding:7px 12px;border-radius:20px;background:#141914d9;font-size:13px;font-weight:600}
#state::before{content:'';display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:100%;background:#9ba49b}main.online #state::before{background:#b5e99a}
footer{bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:7px;align-items:center}
footer button{font-size:14px;min-width:74px}#gate,#settings{background:#1a201cf5;box-shadow:0 8px 40px #0005;border:1px solid #ffffff29;border-radius:20px;padding:20px}
#gate{width:min(88%,335px);top:50%;left:50%;transform:translate(-50%,-50%)}h1{font-size:22px;margin:0 0 8px}#detail{font-size:14px;color:#c3cbc1;margin:0 0 18px}
#pair{display:grid;gap:8px}input,select{width:100%;border:1px solid #59625a;border-radius:8px;background:#101510;color:inherit;padding:8px}#code{font-size:20px;letter-spacing:.15em}#connect{width:100%}
#settings{right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 50px);width:min(340px,94vw);max-height:calc(100% - 140px);overflow:auto}
#settings label{display:grid;grid-template-columns:1fr 1.4fr;align-items:center;gap:6px;margin-bottom:10px}
#settings small,#camHint{color:#bfcbbe;font-size:13px}#frameTools{margin:12px 0}#settings button{font-size:14px;padding:7px 12px}#notice{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 54px);left:50%;transform:translateX(-50%);width:max-content;max-width:88%;padding:5px 12px;border-radius:10px;background:#1d231ef2;font-size:14px}#notice:empty{display:none}
@media(max-height:500px){footer{right:max(12px,env(safe-area-inset-right));left:auto}#settings{max-height:calc(100% - 90px)}}
</style></head><body><main id="app">
<div id="camEmpty">摄像头已关闭</div>
<div id="stage" hidden><video id="sensor" muted playsinline autoplay disablepictureinpicture aria-hidden="true"></video><canvas id="preview" width="640" height="360" aria-label="完整取景与遮蔽预览"></canvas></div>
<header><span id="state" role="status">未连接</span><button id="options" aria-expanded="false" aria-controls="settings" hidden>设置</button></header>
<section id="gate"><h1>匠石采集设备</h1><p id="detail">正在连接主机…</p><form id="pair" hidden><label for="code">主机配对码</label><input id="code" required pattern="[0-9]{8}" maxlength="8" inputmode="numeric" autocomplete="one-time-code"><button class="primary">配对并连接</button></form><button id="connect" class="primary" hidden>启用手机设备</button></section>
<footer id="toolbar" hidden><button id="unlockAudio" hidden>启用手机声音</button><button id="mute" aria-pressed="false">麦克风</button><button id="camera">摄像头</button><button id="switchLens">翻转镜头</button></footer>
<div id="notice" role="status"></div>
<section id="settings" hidden><label>发送分辨率<select id="resolution"><option value="640">640 px</option><option value="1280" selected>1280 px</option><option value="1920">1920 px</option></select></label>
<label>识别采样间隔<select id="interval"><option value=".5">0.5 秒</option><option value="1">1 秒</option><option value="2" selected>2 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label>
<div id="frameTools" hidden><small id="camState"></small><p id="camHint"></p><button id="mask" aria-pressed="false">画遮蔽区</button> <button id="undo">撤销遮蔽</button> <button id="sendFrame">恢复发送</button></div>
<small id="network"></small><p><button id="disconnect">断开设备</button></p></section>
</main><script src="/phone_camera.js"></script><script src="/device_preview.js"></script><script src="/phone_playback.js"></script><script src="/phone.js"></script></body></html>
