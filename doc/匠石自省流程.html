<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匠石自省流程</title><style>:root{color-scheme:light;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#183947;background:#edf1f2}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#ffffffed;border-bottom:1px solid #ccd6da;padding:12px 18px;backdrop-filter:blur(12px)}header>div{max-width:1150px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:17px;margin:0;color:#183947}nav{display:flex;gap:4px;flex-wrap:wrap}a{font:inherit}nav a,.zoom,.save{padding:6px 10px;border-radius:5px;color:#375460;text-decoration:none;white-space:nowrap;font-size:14px}nav a[aria-current=page]{background:#dcebea;font-weight:700;color:#204d4a}nav a:hover,.zoom:hover,.save:hover{background:#edf3f3}.zoom{border:1px solid #ccd8db;background:white;cursor:pointer}.save{font-size:13px}main{max-width:1090px;margin:18px auto 32px;padding:0 12px}.sheet{overflow-x:auto;border:1px solid #cfdadd;border-radius:9px;background:white;box-shadow:0 2px 10px #1c354808}svg{width:100%;height:auto;display:block;min-width:680px}.large svg{min-width:1220px}body.script .sheet[hidden]{display:none}body:not(.script) .sheet{display:block;margin:0 0 20px}@media(max-width:700px){header{position:static}header>div{gap:6px}nav{order:2;width:100%}.save{margin-left:auto}main{padding:0 4px;margin:8px auto}}@media print{@page{size:A3 landscape;margin:6mm}header{display:none}body,main{margin:0;padding:0;background:white;max-width:none}.sheet,body.script .sheet[hidden]{display:block!important;break-after:page;border:0;box-shadow:none;overflow:visible}.sheet:last-child{break-after:auto}svg,.large svg{min-width:0;width:auto;height:275mm;margin:auto}}</style></head><body><header><div><h1>匠石自省流程</h1><nav aria-label="图页"><a href="#overview">全流程</a><a href="#triggers">触发来源</a><a href="#budget">调度与预算</a><a href="#evaluation">评价与筛选</a><a href="#outlets">结果与去向</a></nav><button type="button" class="zoom" aria-pressed="false">放大阅读</button><a class="save" href="匠石自省流程.drawio" download>可编辑源图 ↓</a></div></header><main><section class="sheet" id="overview" aria-label="全流程">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一次自省怎样走到结果" viewBox="0 0 1000 775"><title>一次自省怎样走到结果</title><defs><marker id="arrow-overview" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,1 L7,4 L0.5,7 Z" fill="#647984"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1000" height="775" fill="#fff"/><text x="26" y="46" font-size="27" font-weight="700" fill="#183947" text-anchor="start">一次自省怎样走到结果</text><text x="26" y="82" font-size="15" font-weight="400" fill="#344957" text-anchor="start">两条路径可以提出新认识。一般自省还可以直接留下工具或交流建议。</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="250,187 250,211.5 250,211.5 250,236" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="740,187 740,211.5 740,211.5 740,236" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="151.10000000000002,319 151.10000000000002,347 161,347 161,375" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="366.1,319 366.1,347 429.6,347 429.6,375" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="731.4,319 731.4,347 680.4,347 680.4,375" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="414.4,460 414.4,493 170,493 170,526" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="555,460 555,493 500,493 500,526" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="691.8,460 691.8,493 825,493 825,526" marker-end="url(#arrow-overview)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="825,605 825,629.5 829,629.5 829,654" marker-end="url(#arrow-overview)"/><rect x="35" y="111" width="430" height="76" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="250" y="145.5" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">从已经发生的事开始</text><text x="250" y="167.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">工具结果、认识被修正、闲时回顾，或人工指定主题</text><rect x="525" y="111" width="430" height="76" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="740" y="145.5" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">从一次真实的回忆开始</text><text x="740" y="167.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">记录当时找到了什么、主认知看到了什么、后来怎样回应</text><rect x="35" y="236" width="430" height="83" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="250" y="264.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">一般自省｜回看选择与后果</text><text x="250" y="286.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">自动任务等待后台机会。人工 reflect 可同步运行。</text><text x="250" y="305.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">低档留下规则摘要，中高档可由模型回答六问。</text><rect x="525" y="236" width="430" height="83" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="740" y="264.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">回忆评价｜有线索才再加工</text><text x="740" y="286.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">先判断召回是否有帮助。有具体理由和材料时，</text><text x="740" y="305.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">再检查旧经历之间的关系、冲突或修正。</text><rect x="35" y="375" width="252" height="85" rx="10" fill="#FBEDE4" stroke="#D1A688" stroke-width="1.6"/><text x="161" y="404.5" font-size="18" font-weight="700" fill="#784A31" text-anchor="middle">工具需求、后续交流</text><text x="161" y="426.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">可以独立提出，或与新认识并存。</text><text x="161" y="445.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">记录为建议，等待后续处理。</text><rect x="365" y="375" width="380" height="85" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="555" y="404.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">候选结果值得留下吗？</text><text x="555" y="426.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">对照来源、增量和用途，逐项比较并说明理由。</text><text x="555" y="445.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">两条路径都允许没有学习候选，活动到此结束。</text><rect x="35" y="526" width="270" height="79" rx="10" fill="#F2F3F5" stroke="#A7ABB4" stroke-width="1.6"/><text x="170" y="562.5" font-size="18" font-weight="700" fill="#4B505B" text-anchor="middle">放弃</text><text x="170" y="583.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">移出试验区，活动历史仍可追查。</text><rect x="365" y="526" width="270" height="79" rx="10" fill="#F2EDFA" stroke="#B8A3D1" stroke-width="1.6"/><text x="500" y="562.5" font-size="18" font-weight="700" fill="#594477" text-anchor="middle">待观察</text><text x="500" y="583.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">留在 A/B 试验区，等待下次比较。</text><rect x="695" y="526" width="260" height="79" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="825" y="562" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">采纳｜可多选</text><text x="825" y="584" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">校验人物归属，按实际容量交付。</text><rect x="595" y="654" width="360" height="75" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="775" y="688" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">记忆　·　个人经验　·　人物相处经验</text><text x="775" y="710" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">后续由不同入口读取，正文只存一份。</text><line x1="26" x2="974" y1="732" y2="732" stroke="#d8e1e4"/><text x="26" y="759" font-size="13" font-weight="400" fill="#516775" text-anchor="start">图 2 展开触发来源　·　图 3 展开执行预算　·　图 4 展开评价　·　图 5 展开写入与读取</text></g></svg>
</section>
<section class="sheet" id="triggers" aria-label="触发来源">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="什么事情会让匠石回头想" viewBox="0 0 1000 837"><title>什么事情会让匠石回头想</title><defs><marker id="arrow-triggers" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,1 L7,4 L0.5,7 Z" fill="#647984"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1000" height="837" fill="#fff"/><text x="26" y="46" font-size="27" font-weight="700" fill="#183947" text-anchor="start">什么事情会让匠石回头想</text><text x="26" y="82" font-size="15" font-weight="400" fill="#344957" text-anchor="start">自动入口登记待办，人工可直接指定主题。图中的扫描条数、经历段数与等待时间均为可调默认值。</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="304,174.2 403.04,174.2 403.04,243" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="304,300 328.5,300 328.5,300.5 353,300.5" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="304,434 328.5,434 328.5,339.6 353,339.6" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="533.7,358 533.7,388.5 533.7,388.5 533.7,419" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="492,491 492,521 492,521 492,551" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="304,600.5 328.5,600.5 328.5,599.5 353,599.5" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="833.5,212 833.5,241.5 833.5,241.5 833.5,271" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="833.5,373 833.5,406 833.5,406 833.5,439" marker-end="url(#arrow-triggers)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="833.5,538 833.5,560 833.5,560 833.5,582" marker-end="url(#arrow-triggers)"/><rect x="26" y="128" width="278" height="84" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="165" y="158" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">活动收尾｜工具已回报异常</text><text x="165" y="179" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">执行器报非 ok，或明确说明未达预期。</text><text x="165" y="197" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">仅检查收尾时已到的本活动结果。</text><rect x="26" y="257" width="278" height="86" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="165" y="287" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">人工修正或驳回已有认识</text><text x="165" y="309" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">人工改状态并写理由。收尾或闲时</text><text x="165" y="328" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">扫描主体历史，默认最近 50 条。</text><rect x="26" y="390" width="278" height="88" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="165" y="421" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">闲时回看旧经历</text><text x="165" y="443" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">默认从最近 40 段中选最早一段，</text><text x="165" y="462" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">查最近 200 条历史排除已选经历。</text><rect x="353" y="243" width="278" height="115" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="492" y="270.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">一般自省队列准入</text><text x="492" y="291.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">同主题信号合并，队中重复请求去重。</text><text x="492" y="309.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">默认冷却 1 小时，队列上限 8 条。</text><text x="492" y="327.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">按当前代码，满队时新请求要比</text><text x="492" y="345.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">队内最急的一条更急才可进入。</text><rect x="353" y="419" width="278" height="72" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="492" y="451.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">等待执行机会</text><text x="492" y="473.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">自动后台择机取一条，急件优先。</text><rect x="26" y="551" width="278" height="99" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="165" y="578" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">人工指定｜reflect</text><text x="165" y="600" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">高档、紧急，直接调用一般自省。</text><text x="165" y="619" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">跳过后台轮询和普通入队限流。</text><text x="165" y="638" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">仍可能因对话占用而让路。</text><rect x="353" y="551" width="278" height="97" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="492" y="586.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">还原现场 → 回看行为</text><text x="492" y="608.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">现场不足时普通任务可结束。</text><text x="492" y="627.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">人工或紧急任务可以注明材料不足。</text><rect x="695" y="128" width="277" height="84" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="833.5" y="157" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">主认知实际发起回忆</text><text x="833.5" y="179" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">记录候选、可见条目和活动关联。</text><text x="833.5" y="198" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">等待本轮结果。</text><rect x="695" y="271" width="277" height="102" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="833.5" y="299.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">形成一条回忆观察</text><text x="833.5" y="321.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">接上计划、反馈及交付状态。等待</text><text x="833.5" y="340.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">超时默认 5 分钟可再进入评价。</text><text x="833.5" y="359.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">关闭、空查询、影子模式跳过评价。</text><rect x="695" y="439" width="277" height="99" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="833.5" y="475.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">进入回忆评价待办</text><text x="833.5" y="497.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">正常回填时，待评阶段默认上限</text><text x="833.5" y="516.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">100 条／主体。满时记下跳过原因。</text><rect x="695" y="582" width="277" height="69" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="833.5" y="613" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">待后台选中 → 回忆评价</text><text x="833.5" y="635" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">具体判据见图 4。</text><rect x="26" y="709" width="946" height="70" rx="10" fill="#F7F8FA" stroke="#C2CBD1" stroke-width="1.6"/><text x="499" y="740.5" font-size="18" font-weight="700" fill="#344957" text-anchor="middle">当前闲时选材有固定顺序</text><text x="499" y="762.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">情绪驱动、随机抽取一周前的经历、由任意主认知主动标记疑问，仍属于讨论方向。</text><line x1="26" x2="974" y1="794" y2="794" stroke="#d8e1e4"/><text x="26" y="821" font-size="13" font-weight="400" fill="#516775" text-anchor="start">入口代码　reflection/sources/、reflection/queue.py、reflection/inprocess.py、reflection/memory_store.py</text></g></svg>
</section>
<section class="sheet" id="budget" aria-label="调度与预算">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="后台什么时候获准执行" viewBox="0 0 1000 884"><title>后台什么时候获准执行</title><defs><marker id="arrow-budget" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,1 L7,4 L0.5,7 Z" fill="#647984"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1000" height="884" fill="#fff"/><text x="26" y="46" font-size="27" font-weight="700" fill="#183947" text-anchor="start">后台什么时候获准执行</text><text x="26" y="82" font-size="15" font-weight="400" fill="#344957" text-anchor="start">以下为文字／语音会话后台的默认值。轮询只是检查机会，人工 reflect 和显式 drain 有各自入口。</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="293,186 293,205 293,205 293,224" marker-end="url(#arrow-budget)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="293,311 293,330.5 293,330.5 293,350" marker-end="url(#arrow-budget)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="293,438 293,458 293,458 293,478" marker-end="url(#arrow-budget)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="293,556 293,576 293,576 293,596" marker-end="url(#arrow-budget)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="556,263.15 591,263.15 591,268.32 626,268.32" marker-end="url(#arrow-budget)"/><text x="573.5" y="256.15" font-size="12" font-weight="500" fill="#52636E" text-anchor="middle">未满足</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="556,385.2 800.72,385.2 800.72,354" marker-end="url(#arrow-budget)"/><text x="594" y="378.2" font-size="12" font-weight="500" fill="#52636E" text-anchor="middle">仍需等待</text><rect x="30" y="120" width="526" height="66" rx="10" fill="#EDF3FC" stroke="#97B3D4" stroke-width="1.6"/><text x="293" y="149.5" font-size="18" font-weight="700" fill="#244A70" text-anchor="middle">会话后台每 2 秒检查一次</text><text x="293" y="171.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">文字会话或语音宿主启动后登记。按主体检查。</text><rect x="30" y="224" width="526" height="87" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="293" y="254.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">自省已启用，且前台空闲？</text><text x="293" y="276.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">主对话、待处理输入、语音播放等占用时，本轮让路。</text><text x="293" y="295.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">距最近输入还需满 30 秒，失败退避也需结束。</text><rect x="30" y="350" width="526" height="88" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="293" y="381" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">新任务距上次启动已满 600 秒？</text><text x="293" y="403" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">一般新任务等 10 分钟。正在处理的回忆观察到了再加工或</text><text x="293" y="422" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">比较阶段，可在后续空闲检查继续。间隔按主体上次运行计算。</text><rect x="30" y="478" width="526" height="78" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="293" y="504" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">取得执行锁，每次只做一个阶段</text><text x="293" y="526" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">优先持久思考任务，再处理回忆观察，再看标准是否到期。</text><text x="293" y="545" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">其余机会才取一般自省（含闲时选材）。</text><rect x="30" y="596" width="526" height="93" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="293" y="629.5" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">执行前和模型返回后再查前台</text><text x="293" y="651.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">新输入到来则停止提交，保留待办。已发出的同步模型请求</text><text x="293" y="670.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">仍可能消耗资源。阶段失败默认退避 600 秒再试。</text><rect x="626" y="235" width="336" height="119" rx="10" fill="#F2EDFA" stroke="#B8A3D1" stroke-width="1.6"/><text x="794" y="272" font-size="18" font-weight="700" fill="#594477" text-anchor="middle">条件未满足或锁被占用</text><text x="794" y="294" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">这次检查结束。只要会话仍在运行，</text><text x="794" y="313" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">后续轮询会再次判断。</text><text x="794" y="332" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">排进队列不保证立即执行。</text><rect x="626" y="399" width="336" height="91" rx="10" fill="#F7F8FA" stroke="#C2CBD1" stroke-width="1.6"/><text x="794" y="431.5" font-size="18" font-weight="700" fill="#344957" text-anchor="middle">队列容量控制积压</text><text x="794" y="453.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">一般自省队列上限 8。持久思考队列</text><text x="794" y="472.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">默认也是 8 条／主体，按主题去重。</text><rect x="626" y="527" width="336" height="120" rx="10" fill="#F7F8FA" stroke="#C2CBD1" stroke-width="1.6"/><text x="794" y="564.5" font-size="18" font-weight="700" fill="#344957" text-anchor="middle">模型档位控制单次行为回顾</text><text x="794" y="586.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">低档规则处理，模型调用 0 次。</text><text x="794" y="605.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">有模型时中档、高档当前各调用一次。</text><text x="794" y="624.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">高档 3 次、90 秒超时只登记为参数。</text><rect x="30" y="744" width="932" height="85" rx="10" fill="#F7F8FA" stroke="#C2CBD1" stroke-width="1.6"/><text x="496" y="783" font-size="18" font-weight="700" fill="#344957" text-anchor="middle">这里控制的是机会、并发与每阶段材料</text><text x="496" y="805" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">自动后台没有统一的每日 token 或金额硬上限。10 MiB 管的是试验样本占用，不能限制模型账单。</text><line x1="26" x2="974" y1="841" y2="841" stroke="#d8e1e4"/><text x="26" y="868" font-size="13" font-weight="400" fill="#516775" text-anchor="start">例如上次运行 20:00，最后输入 20:09:50。普通新任务最早约 20:10:20 开始，仍需等空闲轮询。</text></g></svg>
</section>
<section class="sheet" id="evaluation" aria-label="评价与筛选">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="怎样从经历形成一个值得评价的候选" viewBox="0 0 1000 912"><title>怎样从经历形成一个值得评价的候选</title><defs><marker id="arrow-evaluation" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,1 L7,4 L0.5,7 Z" fill="#647984"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1000" height="912" fill="#fff"/><text x="26" y="46" font-size="27" font-weight="700" fill="#183947" text-anchor="start">怎样从经历形成一个值得评价的候选</text><text x="26" y="82" font-size="15" font-weight="400" fill="#344957" text-anchor="start">先评价当时发生了什么，再评价这次新认识的价值。P 编号对应项目提示词索引。</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="253,214 253,239 253,239 253,264" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="747,214 747,239 747,239 747,264" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="253,365 253,392.5 253,392.5 253,420" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="747,365 747,392.5 747,392.5 747,420" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="253,512 253,538.5 276.18,538.5 276.18,565" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="747,512 747,538.5 723.82,538.5 723.82,565" marker-end="url(#arrow-evaluation)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="500,656 500,680.5 500,680.5 500,705" marker-end="url(#arrow-evaluation)"/><rect x="28" y="118" width="450" height="96" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="253" y="153" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">一般自省｜重建当时现场</text><text x="253" y="175" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">以条目时间为中心，前后各 10 分钟。最多 40 段现场，</text><text x="253" y="194" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">另取最多 6 条相关回忆。区分现场、回忆和人物归属。</text><rect x="522" y="118" width="450" height="96" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="747" y="153" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">回忆评价｜P80-30</text><text x="747" y="175" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">对照原问题、候选、主认知实际可见与使用声明、交付状态，</text><text x="747" y="194" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">以及相关的后续交流（默认 5 分钟窗口）。</text><rect x="28" y="264" width="450" height="101" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="253" y="292" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">六问回顾｜P80-10</text><text x="253" y="314" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">发生了什么 → 我的选择与后果 → 为什么 → 能否做得更好</text><text x="253" y="333" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">→ 下次怎么办、是否需工具或交流 → 哪些认识值得再评价。</text><text x="253" y="352" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">低档仅规则摘录。无学习候选时可在活动记录处结束。</text><rect x="522" y="264" width="450" height="101" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="747" y="301.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">回忆质量反馈 → 是否需要再加工？</text><text x="747" y="323.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">回写对检索有用的反馈。新观察须同时有再加工意向、</text><text x="747" y="342.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">具体理由和事件材料。缺一项就结束。旧记录走兼容路径。</text><rect x="28" y="420" width="450" height="92" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="253" y="453" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">抽取一般自省候选</text><text x="253" y="475" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">保留具体内容、归因和来源。逐条引用现场或回忆。</text><text x="253" y="494" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">缺少逐条引用时只指向本次自省，不能据此认定人物。</text><rect x="522" y="420" width="450" height="92" rx="10" fill="#EDF4F6" stroke="#91ADB8" stroke-width="1.6"/><text x="747" y="453" font-size="18" font-weight="700" fill="#244B59" text-anchor="middle">旧经历再加工｜P80-40</text><text x="747" y="475" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">比较旧经历之间的关系、冲突或修正。可返回零条。</text><text x="747" y="494" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">既有自省认识不能递归充当新认识的种子。</text><rect x="139" y="565" width="722" height="91" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="500" y="597.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">核对具体内容、依据、可追溯来源</text><text x="500" y="619.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">逐字复述、空内容、缺依据或引用越界的材料被过滤。候选正文每条最多 2,000 字符。</text><text x="500" y="638.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">初评材料先留在待办，走到这里仍未成为可召回记忆。</text><rect x="139" y="705" width="722" height="110" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="500" y="739" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">同一可替换评价模块｜P80-50</text><text x="500" y="760" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">每次最多比较 24 条，总材料最多 24,000 字符。新候选最多占 12 条，兼取两桶首尾和轮换样本。</text><text x="500" y="778" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">模型核对认识增量、证据范围和适用出口，给出相对次序与逐条去留理由。</text><text x="500" y="796" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">模型输出无效或与可见材料不符时保留待办重试。程序再校验人物范围与容量。</text><line x1="26" x2="974" y1="869" y2="869" stroke="#d8e1e4"/><text x="26" y="896" font-size="13" font-weight="400" fill="#516775" text-anchor="start">结果进入图 5。工具和后续交流建议取自六问，可独立于学习候选成立。</text></g></svg>
</section>
<section class="sheet" id="outlets" aria-label="结果与去向">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="最后留下什么，谁能读到" viewBox="0 0 1000 916"><title>最后留下什么，谁能读到</title><defs><marker id="arrow-outlets" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,1 L7,4 L0.5,7 Z" fill="#647984"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1000" height="916" fill="#fff"/><text x="26" y="46" font-size="27" font-weight="700" fill="#183947" text-anchor="start">最后留下什么，谁能读到</text><text x="26" y="82" font-size="15" font-weight="400" fill="#344957" text-anchor="start">评价同时决定去留与用途。相对排序、模型建议的出口、程序实际交付的出口分别留痕。</text><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="356,176 356,201 171,201 171,226" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="500,176 500,201 501,201 501,226" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="644,176 644,201 829,201 829,226" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="436.76,319 436.76,349 311.89,349 311.89,379" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="829,319 829,350 825,350 825,381" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="515,486 515,523.5 171,523.5 171,561" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="665,486 665,523.5 501,523.5 501,561" marker-end="url(#arrow-outlets)"/><polyline fill="none" stroke="#647984" stroke-width="1.7" stroke-linejoin="round" points="855,486 855,523.5 829,523.5 829,561" marker-end="url(#arrow-outlets)"/><rect x="260" y="108" width="480" height="68" rx="10" fill="#FFF4D9" stroke="#D8A946" stroke-width="1.6"/><text x="500" y="138.5" font-size="18" font-weight="700" fill="#634616" text-anchor="middle">评价模块给出逐项决定</text><text x="500" y="160.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">新候选或抽样旧例，都可以放弃、留待观察或采纳。</text><rect x="25" y="226" width="292" height="93" rx="10" fill="#F2F3F5" stroke="#A7ABB4" stroke-width="1.6"/><text x="171" y="259.5" font-size="18" font-weight="700" fill="#4B505B" text-anchor="middle">放弃</text><text x="171" y="281.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">清出试验样本。活动历史仍可追查。</text><text x="171" y="300.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">此前已沉淀的正式结果保留。</text><rect x="355" y="226" width="292" height="93" rx="10" fill="#F2EDFA" stroke="#B8A3D1" stroke-width="1.6"/><text x="501" y="260.5" font-size="18" font-weight="700" fill="#594477" text-anchor="middle">待观察｜A/B 试验区</text><text x="501" y="281.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">样本存入 pressure 表，每主体 10 MiB。</text><text x="501" y="299.5" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">A、B 各 5 MiB，随比较滚动。</text><rect x="683" y="226" width="292" height="93" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="829" y="259.5" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">采纳｜可同时选择多个出口</text><text x="829" y="281.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">校验本轮可见 ID、逐条理由、去留</text><text x="829" y="300.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">互斥、人物归属以及各出口容量。</text><rect x="25" y="379" width="393" height="116" rx="10" fill="#F2EDFA" stroke="#B8A3D1" stroke-width="1.6"/><text x="221.5" y="416" font-size="18" font-weight="700" fill="#594477" text-anchor="middle">试验样本怎样产生标准</text><text x="221.5" y="437" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">至少 4 条有效样本可形成首版。此后任一桶相对</text><text x="221.5" y="455" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">上版新增且仍存续的内容，占当前桶字节的</text><text x="221.5" y="473" font-size="14" font-weight="400" fill="#304755" text-anchor="middle">1/3 时可更新。各版标准存入 standards 表。</text><rect x="475" y="381" width="500" height="105" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="725" y="420.5" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">写入正式结果｜同一条正文只存一份</text><text x="725" y="442.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">按主体保存在 reflection_memory.sqlite3 的 insights 表，</text><text x="725" y="461.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">记录可用出口与来源。正式结果正文共用默认 20 MiB。</text><rect x="25" y="561" width="292" height="118" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="171" y="597.5" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">可召回记忆</text><text x="171" y="619.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">从普通回忆入口按查询取用。</text><text x="171" y="638.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">记忆出口另受 10% 比例和启动期</text><text x="171" y="657.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">64 KiB 引导额度限制。</text><rect x="355" y="561" width="292" height="118" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="501" y="597.5" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">个人经验</text><text x="501" y="619.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">个人世界按“自身认识”读取，保留</text><text x="501" y="638.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">来源。只选个人经验时，普通回忆</text><text x="501" y="657.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">不会把它当作事件返回。</text><rect x="683" y="561" width="292" height="118" rx="10" fill="#E7F4EE" stroke="#76AD96" stroke-width="1.6"/><text x="829" y="597.5" font-size="18" font-weight="700" fill="#285945" text-anchor="middle">人物相处经验</text><text x="829" y="619.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">引用材料能归到同一交往对象，</text><text x="829" y="638.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">且当前人物身份已确认时才提供。</text><text x="829" y="657.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">与已有相处经验共享装配字数预算。</text><rect x="25" y="747" width="950" height="87" rx="10" fill="#FBEDE4" stroke="#D1A688" stroke-width="1.6"/><text x="500" y="777.5" font-size="18" font-weight="700" fill="#784A31" text-anchor="middle">另外两个出口来自一般自省六问</text><text x="500" y="799.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">工具需求及后续交流记为待处理建议，保存在主体历史的 introspection_candidate 中。它们可以单独成立，</text><text x="500" y="818.5" font-size="15" font-weight="400" fill="#304755" text-anchor="middle">也可以与记忆或经验并存。建议本身不会执行工具或发送消息。</text><line x1="26" x2="974" y1="873" y2="873" stroke="#d8e1e4"/><text x="26" y="900" font-size="13" font-weight="400" fill="#516775" text-anchor="start">10 MiB 和 20 MiB 均为正文预算。活动日志、待评材料、数据库页与索引另计。</text></g></svg>
</section></main><script>document.body.classList.add('script');const sheets=[...document.querySelectorAll('.sheet')],tabs=[...document.querySelectorAll('nav a')];function show(){const id=location.hash.slice(1);const current=sheets.find(s=>s.id===id)||sheets[0];sheets.forEach(s=>s.hidden=s!==current);tabs.forEach(a=>a.hash==='#'+current.id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));}addEventListener('hashchange',show);show();document.querySelector('.zoom').onclick=e=>{const enlarged=document.querySelector('main').classList.toggle('large');e.target.textContent=enlarged?'适合宽度':'放大阅读';e.target.setAttribute('aria-pressed',String(enlarged))};</script></body></html>
